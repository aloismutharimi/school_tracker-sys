{% extends "base.html" %}

{% block title %}Add Student · School Tracker{% endblock %}

{% block content %}
    <h1>Add Student</h1>
    <p class="page-sub">Register a new student on the system</p>

    <div class="card">
        <form method="POST" class="form-grid">
            <div class="field">
                <label for="id">Student ID <span style="color:#f87171;">*</span></label>
                <input type="text" id="id" name="id" placeholder="e.g. STU011"
                       value="{{ form.id }}" required autofocus>
            </div>

            <div class="field">
                <label for="name">Full Name <span style="color:#f87171;">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Wanjiku Kamau"
                       value="{{ form.name }}" required>
            </div>

            <div class="field">
                <label for="class">Class <span style="color:#f87171;">*</span></label>
                <input type="text" id="class" name="class" list="class-options"
                       placeholder="e.g. Form 2" value="{{ form.class }}" required>
                <datalist id="class-options">
                    {% for c in classes %}
                        <option value="{{ c }}">
                    {% endfor %}
                </datalist>
            </div>

            <div class="field">
                <label for="phone">Guardian Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. +254712345001"
                       value="{{ form.phone }}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Save Student</button>
                <a href="{{ url_for('students') }}" class="btn secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
